<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title description">
  <title id="title">Project screenshot placeholder</title>
  <desc id="description">A labeled placeholder showing where to add a screenshot of the running E-commerce Chatbot Streamlit interface.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef4ff"/>
      <stop offset="1" stop-color="#f4efff"/>
    </linearGradient>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .heading { fill: #172033; font-size: 30px; font-weight: 700; }
      .copy { fill: #526174; font-size: 17px; }
      .small { fill: #6b7280; font-size: 14px; }
    </style>
  </defs>
  <rect width="1200" height="660" rx="24" fill="url(#background)"/>
  <rect x="90" y="62" width="1020" height="536" rx="18" fill="#ffffff" stroke="#d4ddec" stroke-width="2"/>
  <path d="M90 82a20 20 0 0 1 20-20h980a20 20 0 0 1 20 20v44H90z" fill="#f7f9fc"/>
  <circle cx="122" cy="94" r="7" fill="#f87171"/>
  <circle cx="146" cy="94" r="7" fill="#fbbf24"/>
  <circle cx="170" cy="94" r="7" fill="#34d399"/>
  <rect x="430" y="82" width="340" height="24" rx="12" fill="#e8edf5"/>
  <text x="600" y="248" text-anchor="middle" class="heading">Project screenshot goes here</text>
  <text x="600" y="292" text-anchor="middle" class="copy">Run the Streamlit app, capture its chat interface,</text>
  <text x="600" y="320" text-anchor="middle" class="copy">then replace this placeholder image.</text>
  <rect x="375" y="365" width="450" height="64" rx="12" fill="#eff6ff" stroke="#c9dbfb"/>
  <text x="402" y="404" class="small">User: Show me top-rated products</text>
  <rect x="425" y="448" width="400" height="64" rx="12" fill="#f4f0ff" stroke="#d9cdfc"/>
  <text x="452" y="487" class="small">Assistant: Add your real app screenshot here</text>
  <text x="600" y="559" text-anchor="middle" class="small">Placeholder only — not an actual application screenshot</text>
</svg>
