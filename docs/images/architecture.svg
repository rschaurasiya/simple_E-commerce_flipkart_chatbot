<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title description">
  <title id="title">E-commerce Chatbot architecture</title>
  <desc id="description">A Streamlit chat message is routed semantically to the FAQ retrieval, product SQL, or small-talk path. FAQ and language generation use Groq, FAQ retrieval uses ChromaDB, and product queries use SQLite and pandas.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #172033; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #526174; }
      .node-title { font-size: 17px; font-weight: 700; }
      .node-copy { font-size: 13px; fill: #526174; }
      .section { font-size: 14px; font-weight: 700; letter-spacing: 1px; fill: #526174; }
      .line { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
      .box { stroke-width: 1.5; rx: 14; }
    </style>
  </defs>

  <rect width="1280" height="760" fill="#f5f7fb"/>
  <text x="54" y="58" class="title">E-commerce Chatbot Architecture</text>
  <text x="54" y="86" class="subtitle">Semantic intent routing connects the Streamlit chat UI to FAQ retrieval, product search, and conversational responses.</text>

  <text x="54" y="145" class="section">USER INPUT AND ROUTING</text>
  <rect x="54" y="176" width="170" height="96" class="box" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="139" y="214" text-anchor="middle" class="node-title">User</text>
  <text x="139" y="239" text-anchor="middle" class="node-copy">Question or message</text>

  <rect x="292" y="176" width="205" height="96" class="box" fill="#eaf2ff" stroke="#93b4f4"/>
  <text x="394" y="214" text-anchor="middle" class="node-title">Streamlit UI</text>
  <text x="394" y="239" text-anchor="middle" class="node-copy">app/main.py · chat session</text>

  <rect x="568" y="165" width="250" height="118" class="box" fill="#eeeaff" stroke="#b4a6f5"/>
  <text x="693" y="207" text-anchor="middle" class="node-title">Semantic Router</text>
  <text x="693" y="232" text-anchor="middle" class="node-copy">semantic-router</text>
  <text x="693" y="253" text-anchor="middle" class="node-copy">MiniLM sentence embeddings</text>

  <path d="M224 224 H285" class="line"/>
  <path d="M497 224 H561" class="line"/>

  <text x="54" y="339" class="section">ROUTE-SPECIFIC PROCESSING</text>

  <rect x="54" y="365" width="1168" height="104" class="box" fill="#ecfdf5" stroke="#86d6ad"/>
  <rect x="54" y="365" width="170" height="104" rx="14" fill="#d7f7e6"/>
  <text x="139" y="407" text-anchor="middle" class="node-title">FAQ route</text>
  <text x="139" y="432" text-anchor="middle" class="node-copy">app/faq.py</text>
  <rect x="280" y="382" width="230" height="70" class="box" fill="#ffffff" stroke="#b8e6cb"/>
  <text x="395" y="411" text-anchor="middle" class="node-title">FAQ CSV</text>
  <text x="395" y="434" text-anchor="middle" class="node-copy">questions and answer metadata</text>
  <rect x="566" y="382" width="250" height="70" class="box" fill="#ffffff" stroke="#b8e6cb"/>
  <text x="691" y="411" text-anchor="middle" class="node-title">ChromaDB retrieval</text>
  <text x="691" y="434" text-anchor="middle" class="node-copy">top matching FAQ entries</text>
  <rect x="872" y="382" width="300" height="70" class="box" fill="#ffffff" stroke="#b8e6cb"/>
  <text x="1022" y="411" text-anchor="middle" class="node-title">Groq response generation</text>
  <text x="1022" y="434" text-anchor="middle" class="node-copy">answer grounded in retrieved FAQ context</text>
  <path d="M818 202 H850 V417 H865" class="line"/>
  <path d="M510 417 H559" class="line"/>
  <path d="M816 417 H865" class="line"/>

  <rect x="54" y="495" width="1168" height="104" class="box" fill="#fff7ed" stroke="#f1c18c"/>
  <rect x="54" y="495" width="170" height="104" rx="14" fill="#ffebd2"/>
  <text x="139" y="537" text-anchor="middle" class="node-title">Product route</text>
  <text x="139" y="562" text-anchor="middle" class="node-copy">app/sql.py</text>
  <rect x="280" y="512" width="230" height="70" class="box" fill="#ffffff" stroke="#f1d1ac"/>
  <text x="395" y="541" text-anchor="middle" class="node-title">Groq SQL generation</text>
  <text x="395" y="564" text-anchor="middle" class="node-copy">natural language to SELECT</text>
  <rect x="566" y="512" width="250" height="70" class="box" fill="#ffffff" stroke="#f1d1ac"/>
  <text x="691" y="541" text-anchor="middle" class="node-title">SQLite + pandas</text>
  <text x="691" y="564" text-anchor="middle" class="node-copy">app/db.sqlite · product table</text>
  <rect x="872" y="512" width="300" height="70" class="box" fill="#ffffff" stroke="#f1d1ac"/>
  <text x="1022" y="541" text-anchor="middle" class="node-title">Groq result summary</text>
  <text x="1022" y="564" text-anchor="middle" class="node-copy">product data formatted for chat</text>
  <path d="M818 224 H840 V547 H865" class="line"/>
  <path d="M510 547 H559" class="line"/>
  <path d="M816 547 H865" class="line"/>

  <rect x="54" y="625" width="1168" height="86" class="box" fill="#f5f3ff" stroke="#c4b5fd"/>
  <rect x="54" y="625" width="170" height="86" rx="14" fill="#e8e2ff"/>
  <text x="139" y="662" text-anchor="middle" class="node-title">Small-talk route</text>
  <text x="139" y="685" text-anchor="middle" class="node-copy">app/smalltalk.py</text>
  <rect x="872" y="642" width="300" height="53" class="box" fill="#ffffff" stroke="#d3cafa"/>
  <text x="1022" y="665" text-anchor="middle" class="node-title">Groq conversational response</text>
  <text x="1022" y="685" text-anchor="middle" class="node-copy">currently receives the route label</text>
  <path d="M818 245 H850 V668 H865" class="line"/>
</svg>
